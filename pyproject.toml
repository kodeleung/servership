[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "servership"
version = "0.1.0"
description = "Interactive multi-server initialization over OpenSSH"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
servership = "servership.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
servership = ["remote/*.sh", "remote/installers/*.sh"]
